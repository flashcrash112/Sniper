[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpfun-sniper"
version = "0.1.0"
description = "A latency-focused pump.fun launch sniper"
requires-python = ">=3.11"
dependencies = [
    "solders>=0.23,<1.0",
    "solana>=0.36,<1.0",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "base58>=2.1",
]

[project.optional-dependencies]
geyser = ["grpcio>=1.60"]
fast = ["orjson>=3.9"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "grpcio-tools>=1.60"]

[project.scripts]
sniper = "sniper.main:main"

[tool.setuptools.packages.find]
include = ["sniper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
